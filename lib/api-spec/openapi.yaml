openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Account operations
paths:
  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the signed-in family account
      description: Requires a server-authorized Parent profile. Deletes the Supabase user and cascading family data.
      responses:
        "204":
          description: Account deleted
        "401":
          description: Authentication required
        "403":
          description: Parent profile required
        "503":
          description: Account deletion is unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

